services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: tesla, POSTGRES_PASSWORD: tesla, POSTGRES_DB: teslapool }
    healthcheck: { test: ["CMD-SHELL","pg_isready -U tesla -d teslapool"], interval: 3s, retries: 10 }
  api:
    build: .
    env_file: .env
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [api]
